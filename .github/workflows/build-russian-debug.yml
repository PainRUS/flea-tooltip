name: Build Russian OCR Debug

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  OCR_DEPS_CACHE_VERSION: v1

jobs:
  typescript:
    name: Verify Electron app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: npm.cmd install

      - name: Run item search regression tests
        shell: pwsh
        run: npm.cmd run test:search

      - name: Download Russian OCR language data
        shell: pwsh
        run: npm.cmd run setup:ru-ocr

      - name: Compile Electron application
        shell: pwsh
        run: npm.cmd run package

  ocr:
    name: Build native OCR runtime
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = 'C:\vcpkg' }
          if (-not (Test-Path "$root\vcpkg.exe")) {
            throw "vcpkg.exe not found at $root"
          }
          "root=$root" >> $env:GITHUB_OUTPUT

      # Tesseract and its dependency tree take ~20 minutes to build from source
      # on a clean runner. Cache the complete installed x64 tree once; normal
      # OCR changes then compile only our small ocr_cpp.exe.
      - name: Restore prebuilt Tesseract dependencies
        id: ocr-deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
            ${{ steps.vcpkg.outputs.root }}\installed\vcpkg
          key: flea-tooltip-ocr-deps-${{ runner.os }}-x64-${{ env.OCR_DEPS_CACHE_VERSION }}

      - name: Ensure Tesseract development dependencies
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.root }}"
          $config = "$root\installed\x64-windows\share\tesseract\TesseractConfig.cmake"
          $header = "$root\installed\x64-windows\include\tesseract\baseapi.h"

          if ((Test-Path $config) -and (Test-Path $header)) {
            Write-Host "Using cached prebuilt Tesseract development dependencies."
            exit 0
          }

          Write-Host "OCR dependency cache is empty; seeding it once with vcpkg."
          & "$root\vcpkg.exe" install tesseract:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed with exit code $LASTEXITCODE"
          }

      - name: Configure OCR build
        shell: pwsh
        run: |
          cmake `
            -S lib/ocr_cpp `
            -B build/ocr `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.root }}\scripts\buildsystems\vcpkg.cmake"

      - name: Build OCR executable
        shell: pwsh
        run: cmake --build build/ocr --config Release --parallel

      - name: Prepare runtime artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/ocr | Out-Null
          Copy-Item build/ocr/Release/ocr_cpp.exe artifact/ocr/ocr_cpp.exe
          Copy-Item "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\bin\*.dll" artifact/ocr/ -Force
          Copy-Item lib/ocr/scanningConfig.json artifact/ocr/scanningConfig.json
          Copy-Item lib/ocr/eng.traineddata artifact/ocr/eng.traineddata
          Invoke-WebRequest `
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata" `
            -OutFile artifact/ocr/rus.traineddata

      - name: Upload OCR runtime
        uses: actions/upload-artifact@v4
        with:
          name: FleaTooltip-OCR-Russian-Debug
          path: artifact/ocr
          if-no-files-found: error

  portable:
    name: Build portable Windows ZIP
    needs:
      - typescript
      - ocr
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: npm.cmd install

      - name: Download freshly built OCR runtime
        uses: actions/download-artifact@v4
        with:
          name: FleaTooltip-OCR-Russian-Debug
          path: artifact/ocr

      - name: Install OCR runtime into Electron resources
        shell: pwsh
        run: |
          Remove-Item lib/ocr/* -Recurse -Force
          Copy-Item artifact/ocr/* lib/ocr/ -Recurse -Force

          $required = @(
            'lib/ocr/ocr_cpp.exe',
            'lib/ocr/scanningConfig.json',
            'lib/ocr/eng.traineddata',
            'lib/ocr/rus.traineddata'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required OCR runtime file is missing: $file"
            }
          }

      - name: Build portable Electron package
        shell: pwsh
        run: npm.cmd run package

      - name: Verify portable package contents
        shell: pwsh
        run: |
          $packageRoot = 'out/FleaTooltip-win32-x64'
          $required = @(
            "$packageRoot/FleaTooltip.exe",
            "$packageRoot/resources/ocr/ocr_cpp.exe",
            "$packageRoot/resources/ocr/scanningConfig.json",
            "$packageRoot/resources/ocr/eng.traineddata",
            "$packageRoot/resources/ocr/rus.traineddata"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Portable package is missing: $file"
            }
          }

      # GitHub Actions downloads artifacts as ZIP archives automatically. Upload
      # the complete portable folder so testers get one ZIP containing the EXE
      # and every required resource/DLL with no manual installation step.
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FleaTooltip-RU-PvE-Test
          path: out/FleaTooltip-win32-x64
          if-no-files-found: error
          retention-days: 30
